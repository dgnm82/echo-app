<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Echo: handheld 60x80 grid view</title><link rel="icon" href="data:,"><script src="pixel.js?v=a0d8667a"></script>
<style>
@font-face{font-family:PS2P;src:url(px/PressStart2P.ttf)}
html,body{margin:0;background:#2E2452;color:#FFF6E6;font:12px PS2P,monospace;text-align:center}
#wrap{display:inline-block;margin:14px auto;padding:14px;background:#3B2A5C;border:4px solid #1f1838;border-radius:28px}
.panel{position:relative;display:inline-block;line-height:0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#grid{position:absolute;left:0;top:0;pointer-events:none;display:none}
.keys{display:flex;justify-content:space-around;margin-top:10px}.keys span{width:22%;height:14px;background:#1f1838;border-radius:7px}
p{max-width:520px;margin:8px auto;line-height:18px;font-size:10px;opacity:.85;font-family:system-ui,sans-serif}
button{font:10px PS2P,monospace;padding:8px 10px;margin:4px;background:#FFD27A;color:#3B2A5C;border:2px solid #1f1838}
</style></head><body>
<p>Handheld grid view: the 60×80 virtual canvas from the hardware addendum, drawn at a whole-number scale (the real 240×320 panel is 4×). Rows: 8 status, 52 stage, 20 choice bar with four 15×20 cells (12×12 icons), one per physical button. Keys 1 to 4 or tap a cell.</p>
<div id="wrap"><div class="panel"><canvas id="c" width="60" height="80"></canvas><canvas id="grid"></canvas></div><div class="keys"><span></span><span></span><span></span><span></span></div></div>
<div><button id="g">Show pixel grid</button><button id="s">Next bond stage</button><button id="v">New seed</button></div>
<script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const q=new URLSearchParams(location.search);let save=null;try{save=JSON.parse(localStorage.getItem('echo-proto-v1'))}catch(e){}
const SCN0={slyte:['clearing','grove','meadow'],whimber:['branch','library','hilltop']};
const SP=(q.get('echo')||(save&&save.kind==='owl'?'whimber':'slyte'))==='whimber'?'whimber':'slyte';
let seed=+(q.get('seed')||(save&&save.g&&save.g.seed)||7),bond=q.has('stage')?[0,150,300,450,450][(+q.get('stage')||1)-1]:(save&&save.bond)||0,release=q.get('stage')==='5';
const img={},load=(k,src)=>new Promise(r=>{const i=new Image();i.onload=()=>{img[k]=i;r()};i.src=src});
// 12x12 icons, ink + 2 colours (feed bowl, heart, star, moon)
const IC={feed:["....YYYY....","...YGGGGY...","..YGGGGGGY..","............","KKKKKKKKKKKK","KBBBBBBBBBBK",".KBBBBBBBBK.","..KBBBBBBK..","...KKKKKK...","............","............","............"],
 pet:["............",".KK....KK...","KPPK..KPPK..","KPPPKKPPPK..","KPPPPPPPPK..",".KPPPPPPK...","..KPPPPK..Y.","...KPPK..YYY","....KK....Y.","............","............","............"],
 play:[".....KK.....",".....KYK....","....KYYK....","KKKKKYYKKKKK",".KYYYYYYYYK.","..KYYYYYYK..","...KYYYYK...","..KYYKKYYK..","..KYK..KYK..",".KK......KK.","............","............"],
 sleep:["....KKK..KKK","...KBBK...K.","..KBBK...K..",".KBBK...KKK.",".KBBK.......",".KBBBK......",".KBBBBKKKK..","..KBBBBBBK..","...KKKKKK...","............","............","............"]};
const COL={K:'#3B2A5C',Y:'#FFD27A',G:'#8CCB7E',B:'#B9A6FF',P:'#FF9EC0'};
const ACTS=['feed','pet','play','sleep'];let sel=-1,anim=null,t=0;
const SCN=(save&&SCN0[SP].includes(save.scene))?save.scene:SCN0[SP][0];
function stage(){return release?5:PIXEL.stageFromBond(bond)}
function draw(){const v=PIXEL.variant(seed,SP),sh=img['s'+v.pal+v.fluff];x.fillStyle='#2E2452';x.fillRect(0,0,60,80);
  x.drawImage(img.bg,0,8,60,52,0,8,60,52);   // Cole's 60x80 scene art (scenes.md v0.2), rows 8-59 between the status strip and choice bar
  // status strip (8 rows): heart + 5 bond segments
  x.fillStyle='#FFF6E6';x.fillRect(0,0,60,8);x.fillStyle='#3B2A5C';x.fillRect(0,7,60,1);
  [[1,2],[2,1],[3,2],[4,1],[5,2]].forEach(([a,b])=>{});const H=["K.K","KKK",".K."];H.forEach((r,ry)=>[...r].forEach((ch,rx)=>{if(ch==='K'){x.fillStyle='#FF8FB8';x.fillRect(2+rx,2+ry,1,1)}}));
  for(let i=0;i<5;i++){x.fillStyle='#3B2A5C';x.fillRect(8+i*10,2,9,4);x.fillStyle=(bond/500)>i/5+.001?'#FF8FB8':'#EBD7BC';x.fillRect(9+i*10,3,7,2)}
  // Echo (48x48) on the stage, feet on the stage floor
  let col=PIXEL.FR.idle[Math.floor(t/2)%6],dy=0;
  if(anim){const k=anim.n;if(anim.a==='sleep')col=k<6?PIXEL.FR.sl1:PIXEL.FR.nap1;else if(anim.a==='feed')col=k%4<2?PIXEL.FR.eat1:PIXEL.FR.eat2;else if(anim.a==='pet')col=k%6<3?PIXEL.FR.pet1:PIXEL.FR.pet2;else col=PIXEL.FR.happy;if(anim.a==='play')dy=-[0,3,6,8,8,6,3,0][Math.min(7,k%8)];}
  else if(t%40>=38)col=SP==='whimber'&&t%80>=40?PIXEL.FR.think:PIXEL.FR.blink;   // Whimber blinks one eye at a time
  else if(SP==='whimber'&&t%90>=84)col=PIXEL.FR.tail1;
  x.drawImage(sh,col*48,0,48,48,6,10+dy,48,48);
  // choice bar (20 rows): four 15x20 cells
  x.fillStyle='#3B2A5C';x.fillRect(0,60,60,20);
  ACTS.forEach((a,i)=>{const cx=i*15,pr=sel===i;x.fillStyle='#1f1838';x.fillRect(cx,60,15,20);x.fillStyle=pr?'#F2A65A':'#FFD27A';x.fillRect(cx+1,61+(pr?2:0),13,pr?17:16);
    if(!pr){x.fillStyle='#C9782E';x.fillRect(cx+1,77,13,2)}
    IC[a].forEach((r,ry)=>[...r].forEach((ch,rx)=>{if(ch!=='.'){x.fillStyle=COL[ch];x.fillRect(cx+1+rx+ (rx>12?0:0),64+ry+(pr?2:0),1,1)}}))});
}
function act(i){sel=i;anim={a:ACTS[i],n:0};bond=Math.min(500,bond+(i===2?20:12));setTimeout(()=>sel=-1,250)}
function fit(){const d=devicePixelRatio||1;let k=4*Math.max(1,Math.floor(Math.min((innerWidth-60)*d/240,(innerHeight-260)*d/320)));k=Math.max(4,k);
  c.style.width=60*k/d+'px';c.style.height=80*k/d+'px';const g=document.getElementById('grid');g.width=60*k;g.height=80*k;g.style.width=c.style.width;g.style.height=c.style.height;
  const gx=g.getContext('2d');gx.clearRect(0,0,g.width,g.height);gx.fillStyle='rgba(255,255,255,.18)';for(let i=0;i<=60;i++)gx.fillRect(i*k,0,1,g.height);for(let j=0;j<=80;j++)gx.fillRect(0,j*k,g.width,1);
  gx.fillStyle='rgba(255,210,122,.8)';[8,60].forEach(r=>gx.fillRect(0,r*k-1,g.width,3));[15,30,45].forEach(cc=>gx.fillRect(cc*k-1,60*k,3,20*k));document.body.dataset.k=k}
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*60,vy=(e.clientY-r.top)/r.height*80;if(vy>=60)act(Math.min(3,Math.floor(vx/15)))});
addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=4)act(n-1)});addEventListener('resize',fit);
document.getElementById('g').onclick=e=>{const g=document.getElementById('grid');g.style.display=g.style.display==='block'?'none':'block'};
document.getElementById('s').onclick=()=>{const s=stage();if(s>=4&&!release)release=true;else{release=false;bond=[150,300,450,0][Math.min(3,s-1)]}};
document.getElementById('v').onclick=()=>{seed=1+Math.floor(Math.random()*99999)};
Promise.all([load('bg',`px/scenes/${SCN}_hh_${[17,18,19,20,21,22,23,0,1,2,3,4,5].includes(new Date().getHours())?'twi':'day'}.png`),...(SP==='whimber'?PIXEL.POWL:PIXEL.PAL).flatMap(p=>[0,1,2,3].map(f=>load('s'+p+f,`px/${SP}_${p}_f${f}.png`)))]).then(()=>{fit();setInterval(()=>{t++;if(anim&&++anim.n>12)anim=null;draw()},83);if(q.get('grid'))document.getElementById('grid').style.display='block';window.__hh={ready:true}});
})();
</script></body></html>

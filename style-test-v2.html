<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fox Echo v2: spirit-fox puppet style test</title><link rel="icon" href="data:,"><script src="spirit.js"></script>
<style>
html.lowfx .mote:nth-child(3n),html.lowfx .mote:nth-child(3n+1){display:none}html.lowfx .glowl .gf{animation:none}html.lowfx .layer{transition:none}
.fxnote{font-size:12px;opacity:.7;text-align:center;margin-top:-6px;padding-bottom:6px}
:root{--ink:#2a1f3a;--paper:#fbf3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:#1d1838;color:var(--paper);transition:background .8s}
body.dusk{background:#120e26}
header{padding:16px 18px 6px;text-align:center}
h1{margin:0;font-size:22px}header p{margin:6px auto 0;max-width:660px;font-size:14px;opacity:.8}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 12px 14px;position:sticky;top:0;z-index:5;background:linear-gradient(#1d1838 75%,#1d183800)}
body.dusk .controls{background:linear-gradient(#120e26 75%,#120e2600)}
.controls button{min-height:48px;min-width:84px;border:0;border-radius:24px;padding:8px 16px;font:600 16px inherit;font-family:inherit;background:#fbf3ff;color:var(--ink);box-shadow:0 3px 0 #0005;cursor:pointer}
.controls button[aria-pressed=true]{background:#ffd98a;outline:3px solid #fff8}
.controls button.alt{background:#3f356e;color:#fbf3ff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 14px 24px;max-width:1500px;margin:0 auto}
@media (max-width:860px){.grid{grid-template-columns:1fr;max-width:520px}}
.card{border-radius:22px;overflow:hidden;background:#000;box-shadow:0 10px 30px #0008;position:relative}
.scene{position:relative;aspect-ratio:3/4;overflow:hidden;touch-action:pan-y;contain:paint}
.layer{position:absolute;left:-6%;top:-4%;width:112%;height:108%;will-change:transform;transition:transform .25s ease-out,opacity .8s}
.layer svg{width:100%;height:100%;display:block}
.sky-dusk{opacity:0}body.dusk .sky-dusk{opacity:1}
.tint{position:absolute;inset:0;background:linear-gradient(#2a1a6a00,#2a1a6a99 55%,#1a1048bb);opacity:0;transition:opacity .8s;pointer-events:none}
body.dusk .tint{opacity:1}
.glowl{opacity:.55}body.dusk .glowl{opacity:1}
.glowl .gf{animation:gpulse 3.5s ease-in-out infinite}
@keyframes gpulse{50%{opacity:.45}}
.puppet{position:absolute;left:50%;bottom:8%;width:76%;transform:translateX(-50%);will-change:transform}
.puppet svg{width:100%;height:auto;overflow:visible;display:block}
.label{position:absolute;left:12px;top:10px;right:12px;width:max-content;max-width:calc(100% - 24px);background:#0007;color:#fff;font-size:12.5px;padding:6px 10px;border-radius:14px}
.mote{position:absolute;bottom:-4%;width:var(--z);height:var(--z);border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fffbe0 0,#ffe98a 30%,#ffd24a00 70%);animation:rise var(--d) linear var(--delay) infinite;opacity:.0}
body.dusk .mote{background:radial-gradient(circle,#fff 0,#b8ffcf 30%,#7affb000 70%)}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}50%{transform:translate(var(--x1),-45vh)}85%{opacity:.8}100%{transform:translate(var(--x2),-95vh);opacity:0}}
.hop{animation:hop .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes hop{40%{transform:translateX(-50%) translateY(-7%) scale(.97,1.04)}75%{transform:translateX(-50%) translateY(0) scale(1.05,.95)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
footer{text-align:center;font-size:12px;opacity:.6;padding:0 0 24px}
</style></head><body>
<header><h1>Fox Echo v2: spirit-fox puppet style test</h1><p>A magical fox Echo built from layered, painterly SVG parts on a rig. Tap the fox to make it hop, drag or tilt for parallax, and switch to twilight to see the glow.</p></header>
<div class="controls" role="toolbar" aria-label="Expressions">
  <button data-e="happy" aria-pressed="true">😊 Happy</button><button data-e="curious">🤔 Curious</button><button data-e="sleepy">😴 Sleepy</button><button data-e="silly">😜 Silly</button><button data-e="shy">☺️ Shy</button>
  <button class="alt" id="dusk" aria-pressed="false">🌙 Twilight</button><button class="alt" id="reroll">🎲 New seeds</button><button class="alt" id="fxbtn">✨ Full effects</button>
</div>
<div class="fxnote" id="fxnote"></div>
<main class="grid" id="grid"></main>
<footer>Style test only (v2). It isn't part of the game. Project Echo prototype.</footer>
<script>
(()=>{
const $=s=>document.querySelector(s);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hx=c=>c.replace('#','').match(/../g).map(x=>parseInt(x,16));
const mix=(a,b,t)=>'#'+hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
const variant=seed=>SPIRIT.variant('fox',seed),slyte=v=>SPIRIT.fox(v);
function grass(r,n,y0,y1,cols){let o='';for(let i=0;i<n;i++){const x=r()*600,y=y0+r()*(y1-y0),h=10+22*(y-y0)/(y1-y0)+r()*8;o+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} q${(3+r()*5).toFixed(1)} ${(-h*.55).toFixed(1)} ${((r()-.35)*12).toFixed(1)} ${(-h).toFixed(1)}" stroke="${cols[Math.floor(r()*cols.length)]}" stroke-width="${(2+r()*2.5).toFixed(1)}" fill="none" stroke-linecap="round"/>`}return o}
function glowFlowers(r,n,y0,y1,id){let o='';const cs=['#9ff7ff','#ffc8ff','#fff2a0','#b8ffcf','#ffd0ec'];for(let i=0;i<n;i++){const x=r()*600,y=y0+r()*(y1-y0),s=3+6*(y-y0)/(y1-y0),c=cs[Math.floor(r()*cs.length)];
  o+=`<g class="gf" style="animation-delay:-${(r()*3.5).toFixed(2)}s"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(s*3.2).toFixed(1)}" fill="url(#gl${id})" opacity=".8"/><path d="M${x.toFixed(1)} ${(y+s).toFixed(1)} v${(s*2.4).toFixed(1)}" stroke="#2f7a5a" stroke-width="1.6"/>${[0,72,144,216,288].map(a=>`<ellipse cx="${x.toFixed(1)}" cy="${(y-s*.6).toFixed(1)}" rx="${(s*.45).toFixed(1)}" ry="${(s*.7).toFixed(1)}" fill="${c}" transform="rotate(${a} ${x.toFixed(1)} ${y.toFixed(1)})"/>`).join('')}<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(s*.4).toFixed(1)}" fill="#fff"/></g>`}return o}
function layers(seed){const r=rng(seed*7+3),V='viewBox="0 0 600 800" preserveAspectRatio="xMidYMax slice"';
 let stars='';for(let i=0;i<70;i++)stars+=`<circle cx="${(r()*600).toFixed(0)}" cy="${(r()*430).toFixed(0)}" r="${(.6+r()*1.6).toFixed(1)}" fill="#fff" opacity="${(.4+r()*.6).toFixed(2)}"/>`;
 return [
  `<svg ${V}><defs><linearGradient id="sky${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc8f0"/><stop offset=".45" stop-color="#d8d0f4"/><stop offset=".75" stop-color="#ffd8e4"/><stop offset="1" stop-color="#ffe6b8"/></linearGradient>
   <radialGradient id="sun${seed}" cx="72%" cy="22%" r="45%"><stop offset="0" stop-color="#fffbe6"/><stop offset=".25" stop-color="#fff1d2" stop-opacity=".6"/><stop offset="1" stop-color="#fff1d2" stop-opacity="0"/></radialGradient></defs>
   <rect width="600" height="800" fill="url(#sky${seed})"/><rect width="600" height="800" fill="url(#sun${seed})"/>
   <g fill="#fff8fe" opacity=".85"><path d="M60 170 q14-30 52-22 q20-26 56-8 q38-4 38 24 q-6 14-30 14 h-104 q-24-2-12-8z"/><path d="M360 110 q10-22 38-14 q16-20 42-4 q28-2 28 18 q-4 10-22 10 h-76 q-18-2-10-10z" opacity=".8"/></g></svg>`,
  `<svg ${V} class="skyd"><defs><linearGradient id="dsky${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140f3a"/><stop offset=".45" stop-color="#3a2a7a"/><stop offset=".75" stop-color="#a04a8a"/><stop offset="1" stop-color="#ff9a7a"/></linearGradient>
   <radialGradient id="moon${seed}" cx="74%" cy="18%" r="18%"><stop offset="0" stop-color="#fff8e0" stop-opacity=".6"/><stop offset="1" stop-color="#fff8e0" stop-opacity="0"/></radialGradient></defs>
   <rect width="600" height="800" fill="url(#dsky${seed})"/>${stars}<rect width="600" height="800" fill="url(#moon${seed})"/><path d="M452 118 A26 26 0 1 0 470 160 A21 21 0 1 1 452 118Z" fill="#fff6dc"/></svg>`,
  `<svg ${V}><path d="M0 470 L60 400 L110 440 L170 350 L240 430 L300 380 L370 440 L430 360 L500 430 L560 390 L600 420 V800 H0Z" fill="#a8a0d8"/>
   <path d="M170 350 L192 380 L178 376 L160 390Z M430 360 L454 392 L438 388 L418 398Z" fill="#f4f0ff" opacity=".9"/>
   <path d="M0 500 Q120 450 250 480 T600 470 V800 H0Z" fill="#8fb8c4"/></svg>`,
  `<svg ${V}><path d="M0 540 Q150 490 300 520 T600 515 V800 H0Z" fill="#5fae8a"/>
   <g fill="#3f8a72"><ellipse cx="80" cy="512" rx="46" ry="34"/><ellipse cx="118" cy="500" rx="34" ry="30" fill="#55a084"/><ellipse cx="520" cy="506" rx="54" ry="38"/></g>
   <g transform="translate(470 400)"><path d="M0 120 C-4 80 6 50 0 10" stroke="#6a4a7a" stroke-width="10" fill="none"/><ellipse cx="0" cy="10" rx="50" ry="40" fill="#c890e0"/><ellipse cx="-20" cy="22" rx="30" ry="22" fill="#a870d0"/><ellipse cx="18" cy="-6" rx="24" ry="18" fill="#e8b8f4"/></g></svg>`,
  `<svg ${V}><defs><linearGradient id="mead${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad888"/><stop offset=".45" stop-color="#5fb07a"/><stop offset="1" stop-color="#2f7a5e"/></linearGradient></defs>
   <path d="M0 600 Q160 566 320 584 T600 576 V800 H0Z" fill="url(#mead${seed})"/>
   ${grass(r,130,590,800,['#3f8a62','#5fb07a','#8ad08a','#2f6e50','#a8e0a0'])}</svg>`,
 ]}
const glowLayer=seed=>{const r=rng(seed*11+7);return `<svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMax slice"><defs><radialGradient id="gl${seed}"><stop offset="0" stop-color="#fffbe0" stop-opacity=".8"/><stop offset="1" stop-color="#fffbe0" stop-opacity="0"/></radialGradient></defs>${glowFlowers(r,26,600,790,seed)}</svg>`};
const FG=seed=>{const r=rng(seed*13+1);return `<svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMax slice">${grass(r,60,770,815,['#24584a','#2f6e50','#3f8a62'])}</svg>`};
let expr='happy';const cards=[];
function build(seeds){const g=$('#grid');g.innerHTML='';cards.length=0;
  seeds.forEach(seed=>{const v=variant(seed),el=document.createElement('section');el.className='card';const L=layers(seed),r=rng(seed+99);
    let motes='';for(let k=0;k<9;k++)motes+=`<div class="mote" style="left:${(r()*100).toFixed(1)}%;--z:${(6+r()*8).toFixed(0)}px;--d:${(8+r()*8).toFixed(1)}s;--delay:${(-r()*16).toFixed(1)}s;--x1:${((r()-.5)*60).toFixed(0)}px;--x2:${((r()-.5)*90).toFixed(0)}px"></div>`;
    
    el.innerHTML=`<div class="scene"><div class="layer" data-depth="0">${L[0]}</div><div class="layer sky-dusk" data-depth="0">${L[1]}</div>
      <div class="layer" data-depth="6">${L[2]}</div><div class="layer" data-depth="12">${L[3]}</div><div class="layer" data-depth="20">${L[4]}</div>
      <div class="tint"></div><div class="layer glowl" data-depth="20">${glowLayer(seed)}</div>
      <div class="puppet">${slyte(v)}</div><div class="layer" data-depth="32" style="pointer-events:none">${FG(seed)}</div>${motes}
      <div class="label">Seed ${seed} · ${SPIRIT.describe(v)}</div></div>`;
    g.appendChild(el);const svg=el.querySelector('svg.sp');svg.setAttribute('data-expr',expr);
    const pup=el.querySelector('.puppet');pup.addEventListener('click',()=>{pup.classList.remove('hop');void pup.offsetWidth;pup.classList.add('hop')});
    cards.push({el,svg,seed});
    const sc=el.querySelector('.scene');sc.addEventListener('pointermove',e=>{const b=sc.getBoundingClientRect();parallax(el,(e.clientX-b.left)/b.width-.5,(e.clientY-b.top)/b.height-.5)});
    sc.addEventListener('pointerleave',()=>parallax(el,0,0));});
}
function parallax(card,x,y){card.querySelectorAll('.layer').forEach(l=>{const d=+l.dataset.depth;l.style.transform=`translate(${(-x*d).toFixed(1)}px,${(-y*d*.5).toFixed(1)}px)`})}
window.addEventListener('deviceorientation',e=>{if(e.gamma==null)return;const x=Math.max(-1,Math.min(1,e.gamma/30))*.5,y=Math.max(-1,Math.min(1,(e.beta-45)/30))*.5;cards.forEach(c=>parallax(c.el,x,y))});

document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{expr=b.dataset.e;document.querySelectorAll('[data-e]').forEach(x=>x.setAttribute('aria-pressed',x===b));cards.forEach(c=>c.svg.setAttribute('data-expr',expr))});
$('#dusk').onclick=()=>{const on=document.body.classList.toggle('dusk');$('#dusk').setAttribute('aria-pressed',on);$('#dusk').textContent=on?'☀️ Day':'🌙 Twilight'};
build([1207,58331,904]);
$('#reroll').onclick=()=>build([0,0,0].map(()=>1+Math.floor(Math.random()*99999)));
const fxUI=()=>{$('#fxbtn').textContent=SPIRIT.fx.low?'🐢 Reduced effects':'✨ Full effects';$('#fxbtn').setAttribute('aria-pressed',SPIRIT.fx.low);$('#fxnote').textContent='Effects: '+(SPIRIT.fx.low?'reduced':'full')+' ('+SPIRIT.fx.reason+'). Tap the button to switch.'};
SPIRIT.fx.listeners.push(fxUI);fxUI();$('#fxbtn').onclick=()=>SPIRIT.fx.toggle();
window.__styleTest={cards:()=>cards.length};
})();
</script></body></html>

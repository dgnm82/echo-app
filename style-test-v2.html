<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slyte v2: spirit-fox puppet style test</title><link rel="icon" href="data:,">
<style>
:root{--ink:#2a1f3a;--paper:#fbf3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:#1d1838;color:var(--paper);transition:background .8s}
body.dusk{background:#120e26}
header{padding:16px 18px 6px;text-align:center}
h1{margin:0;font-size:22px}header p{margin:6px auto 0;max-width:660px;font-size:14px;opacity:.8}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 12px 14px;position:sticky;top:0;z-index:5;background:linear-gradient(#1d1838 75%,#1d183800)}
body.dusk .controls{background:linear-gradient(#120e26 75%,#120e2600)}
.controls button{min-height:48px;min-width:84px;border:0;border-radius:24px;padding:8px 16px;font:600 16px inherit;font-family:inherit;background:#fbf3ff;color:var(--ink);box-shadow:0 3px 0 #0005;cursor:pointer}
.controls button[aria-pressed=true]{background:#ffd98a;outline:3px solid #fff8}
.controls button.alt{background:#3f356e;color:#fbf3ff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 14px 24px;max-width:1500px;margin:0 auto}
@media (max-width:860px){.grid{grid-template-columns:1fr;max-width:520px}}
.card{border-radius:22px;overflow:hidden;background:#000;box-shadow:0 10px 30px #0008;position:relative}
.scene{position:relative;aspect-ratio:3/4;overflow:hidden;touch-action:pan-y;contain:paint}
.layer{position:absolute;left:-6%;top:-4%;width:112%;height:108%;will-change:transform;transition:transform .25s ease-out,opacity .8s}
.layer svg{width:100%;height:100%;display:block}
.sky-dusk{opacity:0}body.dusk .sky-dusk{opacity:1}
.tint{position:absolute;inset:0;background:linear-gradient(#2a1a6a00,#2a1a6a99 55%,#1a1048bb);opacity:0;transition:opacity .8s;pointer-events:none}
body.dusk .tint{opacity:1}
.glowl{opacity:.55}body.dusk .glowl{opacity:1}
.glowl .gf{animation:gpulse 3.5s ease-in-out infinite}
@keyframes gpulse{50%{opacity:.45}}
.puppet{position:absolute;left:50%;bottom:8%;width:76%;transform:translateX(-50%);will-change:transform}
.puppet svg{width:100%;height:auto;overflow:visible;display:block}
.label{position:absolute;left:12px;top:10px;right:12px;width:max-content;max-width:calc(100% - 24px);background:#0007;color:#fff;font-size:12.5px;padding:6px 10px;border-radius:14px}
.mote{position:absolute;bottom:-4%;width:var(--z);height:var(--z);border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fffbe0 0,#ffe98a 30%,#ffd24a00 70%);animation:rise var(--d) linear var(--delay) infinite;opacity:.0}
body.dusk .mote{background:radial-gradient(circle,#fff 0,#b8ffcf 30%,#7affb000 70%)}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}50%{transform:translate(var(--x1),-45vh)}85%{opacity:.8}100%{transform:translate(var(--x2),-95vh);opacity:0}}
/* ---- puppet rig ---- */
.rig *{transform-box:view-box}
.breath{animation:breath 3.4s ease-in-out infinite;transform-origin:150px 300px}
@keyframes breath{50%{transform:scale(1.02,.984)}}
.headbob{animation:headbob 3.4s ease-in-out infinite;transform-origin:150px 196px}
@keyframes headbob{50%{transform:translateY(2.5px) rotate(.6deg)}}
.tail{animation:tailsway 3s ease-in-out infinite;transform-origin:196px 262px}
@keyframes tailsway{0%,100%{transform:rotate(0)}45%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}}
.wisp{animation:wisp 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:20% 90%}
.wisp.w2{animation-duration:2.1s;animation-delay:-.7s}.wisp.w3{animation-duration:1.3s;animation-delay:-.3s}
@keyframes wisp{to{transform:skewX(-7deg) scale(1.04,.96)}}
.spark{animation:spark 2.4s ease-in infinite;transform-box:fill-box;transform-origin:center;opacity:0}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}30%{opacity:1;transform:translate(-4px,-10px) scale(1)}100%{opacity:0;transform:translate(-14px,-40px) scale(.3)}}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.earL{transform-origin:112px 118px}.earR{transform-origin:188px 118px}
.flickL .earL{animation:flickL .5s ease-out}.flickR .earR{animation:flickR .5s ease-out}
@keyframes flickL{25%{transform:rotate(-16deg)}55%{transform:rotate(7deg)}}@keyframes flickR{25%{transform:rotate(16deg)}55%{transform:rotate(-7deg)}}
.tflick .tailInner{animation:tflick .7s ease-out}
@keyframes tflick{30%{transform:rotate(-14deg)}65%{transform:rotate(6deg)}}
.tailInner{transform-origin:196px 262px}
.lid{transform:scaleY(0);transform-box:fill-box;transform-origin:center top;transition:transform .07s ease-in}
.blink .lid{transform:scaleY(1)}
.x{opacity:0;transition:opacity .18s}
[data-expr=happy] .x-happy,[data-expr=curious] .x-curious,[data-expr=sleepy] .x-sleepy,[data-expr=silly] .x-silly,[data-expr=shy] .x-shy{opacity:1}
.x-open{opacity:1;transition:opacity .18s}
[data-expr=happy] .x-open,[data-expr=sleepy] .x-open,[data-expr=silly] .eyeL .x-open{opacity:0}
.headpose{transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-origin:150px 196px}
[data-expr=curious] .headpose{transform:rotate(-11deg)}
[data-expr=silly] .headpose{transform:rotate(9deg) translateY(-2px)}
[data-expr=sleepy] .headpose{transform:translateY(7px) rotate(4deg)}
[data-expr=shy] .headpose{transform:translateY(8px) rotate(6deg)}
[data-expr=happy] .headpose{transform:translateY(-3px)}
.earpose{transition:transform .45s ease}
.earL .earpose{transform-origin:112px 118px}.earR .earpose{transform-origin:188px 118px}
[data-expr=curious] .earL .earpose{transform:rotate(-10deg)} [data-expr=curious] .earR .earpose{transform:rotate(6deg)}
[data-expr=sleepy] .earL .earpose{transform:rotate(-20deg)} [data-expr=sleepy] .earR .earpose{transform:rotate(20deg)}
[data-expr=shy] .earL .earpose{transform:rotate(-34deg) translateY(6px)} [data-expr=shy] .earR .earpose{transform:rotate(34deg) translateY(6px)}
[data-expr=silly] .earL .earpose{transform:rotate(-24deg)}
[data-expr=happy] .tail{animation-duration:.7s}[data-expr=silly] .tail{animation-duration:1s}[data-expr=sleepy] .tail{animation-duration:6s}
/* shy: back tail fades out, a wrapped front tail curls around the paws (no more hidden tail) */
.tailBack{transition:opacity .35s}.tailFront{opacity:0;transition:opacity .35s;transform-origin:190px 280px}
[data-expr=shy] .tailBack{opacity:0}[data-expr=shy] .tailFront{opacity:1;animation:tfront 3s ease-in-out infinite}
@keyframes tfront{50%{transform:rotate(-2deg)}}
.pupils{transition:transform .35s ease}
[data-expr=shy] .pupils{transform:translate(5px,5px)}[data-expr=curious] .pupils{transform:translate(-3px,-3px)}
[data-expr=sleepy] .breath{animation-duration:5.5s}
.zz{opacity:0}[data-expr=sleepy] .zz{animation:zz 3s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(16px,-30px)}}
.hop{animation:hop .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes hop{40%{transform:translateX(-50%) translateY(-7%) scale(.97,1.04)}75%{transform:translateX(-50%) translateY(0) scale(1.05,.95)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
footer{text-align:center;font-size:12px;opacity:.6;padding:0 0 24px}
</style></head><body>
<header><h1>Slyte v2: spirit-fox puppet style test</h1><p>A magical Slyte built from layered, painterly SVG parts on a rig. Tap a Slyte to make it hop, drag or tilt for parallax, and switch to twilight to see the glow.</p></header>
<div class="controls" role="toolbar" aria-label="Expressions">
  <button data-e="happy" aria-pressed="true">😊 Happy</button><button data-e="curious">🤔 Curious</button><button data-e="sleepy">😴 Sleepy</button><button data-e="silly">😜 Silly</button><button data-e="shy">☺️ Shy</button>
  <button class="alt" id="dusk" aria-pressed="false">🌙 Twilight</button><button class="alt" id="reroll">🎲 New seeds</button>
</div>
<main class="grid" id="grid"></main>
<footer>Style test only (v2). It isn't part of the game. Project Echo prototype.</footer>
<script>
(()=>{
const $=s=>document.querySelector(s);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hx=c=>c.replace('#','').match(/../g).map(x=>parseInt(x,16));
const mix=(a,b,t)=>'#'+hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
// grain: one small noise tile made once on a canvas, used as an SVG pattern (cheap on phones, unlike live feTurbulence)
const GRAIN=(()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),d=x.createImageData(96,96);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);return c.toDataURL()})();
const PALS=[{n:'teal-violet',f:['#5fe3d0','#2fa6c8','#6a4fd0'],g:'#a8fff4',e:'#2ad0c0'},{n:'violet-rose',f:['#c9a0ff','#9a5ae0','#e0609a'],g:'#ffd0ff',e:'#b45af0'},
  {n:'gold-rose',f:['#ffe08a','#f2a24a','#d8508a'],g:'#fff4b0',e:'#f0a020'},{n:'rose-sapphire',f:['#ffb0cf','#e0609a','#4a6ae0'],g:'#ffe0f2',e:'#e0508a'},
  {n:'teal-gold',f:['#a8f0c0','#2fbf9a','#c8901a'],g:'#f4ffb8',e:'#20b088'}];
let uid=0;
function variant(seed){const r=rng(seed),pick=a=>a[Math.floor(r()*a.length)],span=(a,b)=>a+(b-a)*r();
  return {seed,pal:pick(PALS),rune:pick(['swirl','chevron','dots']),horns:r()<.5,gem:r()<.5,accent:pick(['leaf','flower','none']),
    ear:span(.88,1.16),tail:span(.88,1.15),head:span(.96,1.06),leg:span(.92,1.1),body:span(.92,1.06),eyeSize:span(.95,1.08)}}
const star=(x,y,s,f)=>`<path d="M${x} ${y-s} Q${x+s*.18} ${y-s*.18} ${x+s} ${y} Q${x+s*.18} ${y+s*.18} ${x} ${y+s} Q${x-s*.18} ${y+s*.18} ${x-s} ${y} Q${x-s*.18} ${y-s*.18} ${x} ${y-s}Z" fill="${f}"/>`;
function slyte(v){const id='s'+(++uid),P=v.pal,[c1,c2,c3]=P.f,G=P.g,ink=mix(c3,'#140a24',.62),sh=mix(c3,'#1a0a38',.35),rim='#fff6d8',cr=mix('#fdf8ff',c1,.12),r=rng(v.seed+5);
  const S=(cx,cy,s)=>`translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`,SX=(cx,cy,sx,sy)=>`translate(${cx} ${cy}) scale(${sx} ${sy}) translate(${-cx} ${-cy})`;
  const fur=(n,x0,x1,y0,y1,col,w)=>{let o='';for(let i=0;i<n;i++){const x=x0+r()*(x1-x0),y=y0+r()*(y1-y0);o+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} q${(2+r()*3).toFixed(1)} ${(5+r()*4).toFixed(1)} ${(r()*6-1).toFixed(1)} ${(9+r()*6).toFixed(1)}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" opacity="${(.35+r()*.35).toFixed(2)}"/>`}return o};
  const eye=(cx,cls,flip)=>{const R=19*v.eyeSize,cy=170;return `<g class="${cls}">
    <g class="x-open"><ellipse cx="${cx}" cy="${cy}" rx="${R}" ry="${R*1.1}" fill="#fffaff" stroke="${ink}" stroke-width="2.6"/>
     <g class="pupils"><ellipse cx="${cx}" cy="${cy+2}" rx="${R*.8}" ry="${R*.9}" fill="url(#iris${id})"/><ellipse cx="${cx}" cy="${cy+3}" rx="${R*.44}" ry="${R*.54}" fill="#140a24"/>
      ${star(cx-R*.32,cy-R*.36,R*.34,'#fff')}<circle cx="${cx+R*.34}" cy="${cy+R*.3}" r="${R*.12}" fill="#fff"/>${star(cx+R*.2,cy-R*.52,R*.12,'#fff')}</g>
     <rect class="lid" x="${cx-R-2}" y="${cy-R*1.2}" width="${2*R+4}" height="${R*2.3}" fill="url(#fur${id})"/></g>
    <path class="x x-happy" d="M${cx-R} ${cy+4} Q${cx} ${cy-16} ${cx+R} ${cy+4}" stroke="${ink}" stroke-width="4.2" fill="none" stroke-linecap="round"/>
    <path class="x x-sleepy" d="M${cx-R} ${cy+2} Q${cx} ${cy+12} ${cx+R} ${cy+2}" stroke="${ink}" stroke-width="4.2" fill="none" stroke-linecap="round"/>
    ${cls==='eyeL'?`<path class="x x-silly" d="M${cx-R} ${cy+2} Q${cx} ${cy-9} ${cx+R} ${cy+2}" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`:''}</g>`};
  const ear=(cls,x,d)=>`<g class="${cls}"><g class="earpose"><g transform="${S(x,118,v.ear)}">
    <path d="M${x-22*d} 128 C${x-26*d} 92 ${x-14*d} 52 ${x-4*d} 38 C${x+10*d} 56 ${x+28*d} 84 ${x+34*d} 112 Z" fill="url(#fur${id})" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M${x-12*d} 118 C${x-14*d} 92 ${x-8*d} 70 ${x-3*d} 60 C${x+8*d} 74 ${x+18*d} 92 ${x+22*d} 110 Z" fill="${sh}" opacity=".7"/>
    <path d="M${x-8*d} 112 C${x-8*d} 94 ${x-5*d} 82 ${x-2*d} 74 C${x+5*d} 84 ${x+11*d} 96 ${x+14*d} 108 Z" fill="${mix(cr,'#ffb0d0',.4)}" opacity=".85"/>
    <path d="M${x-14*d} 66 C${x-10*d} 54 ${x-6*d} 44 ${x-4*d} 38 C${x+4*d} 48 ${x+10*d} 56 ${x+14*d} 66 Q${x} 60 ${x-14*d} 66Z" fill="${G}" filter="url(#glow${id})" class="pulse"/>
    <path d="M${x-4*d} 40 C${x+8*d} 58 ${x+24*d} 82 ${x+31*d} 106" stroke="${rim}" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="${d>0?.85:.35}"/></g></g></g>`;
  const leg=(x,front)=>`<g transform="${SX(x,236,1,v.leg)}"><path d="M${x-10} 236 C${x-11} 258 ${x-9} 276 ${x-8} 290 Q${x-13} 298 ${x-12} 303 Q${x} 309 ${x+12} 303 Q${x+13} 298 ${x+8} 290 C${x+9} 276 ${x+11} 258 ${x+10} 236Z" fill="${front?`url(#leg${id})`:mix(c3,'#1a0a38',.25)}" stroke="${ink}" stroke-width="2.6" stroke-linejoin="round"/>
    ${front?`<path d="M${x-4} 302 v-5 M${x+4} 302 v-5" stroke="${ink}" stroke-width="1.6" stroke-linecap="round"/><path d="M${x+7} 244 C${x+8} 260 ${x+7} 276 ${x+5} 288" stroke="${rim}" stroke-width="2" fill="none" opacity=".75"/><ellipse cx="${x}" cy="302" rx="9" ry="3" fill="${G}" opacity=".55" class="pulse"/>`:''}</g>`;
  const rune=v.rune==='swirl'?`<path d="M168 214 q14 4 14 16 q0 10 -10 10 q-7 0 -7 -7 q0 -5 5 -5" stroke="${G}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M124 250 q-8 6 -4 16" stroke="${G}" stroke-width="3" fill="none" stroke-linecap="round"/>`
    :v.rune==='chevron'?`<path d="M164 214 l12 10 -12 10 M174 214 l12 10 -12 10" stroke="${G}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 252 l-6 8 6 8" stroke="${G}" stroke-width="3" fill="none" stroke-linecap="round"/>`
    :`<g fill="${G}"><circle cx="170" cy="218" r="3.4"/><circle cx="180" cy="228" r="2.6"/><circle cx="172" cy="238" r="3"/><circle cx="120" cy="254" r="3"/><circle cx="116" cy="266" r="2.4"/></g>`;
  const brow=v.gem?'':`<g class="pulse" filter="url(#glow${id})"><path d="M150 128 l6 9 -6 9 -6 -9z" fill="none" stroke="${G}" stroke-width="2.4" stroke-linejoin="round"/><circle cx="136" cy="140" r="2" fill="${G}"/><circle cx="164" cy="140" r="2" fill="${G}"/></g>`;
  const flameTail=`<path d="M186 278 C236 292 276 262 272 214 C270 186 286 166 298 146 C280 152 268 140 266 118 C252 140 246 164 240 184 C236 216 216 240 186 250Z" fill="url(#flame${id})" stroke="${ink}" stroke-width="2.6" stroke-linejoin="round"/>
    <path class="wisp" d="M262 160 C266 140 280 126 296 120 C288 134 286 148 276 166Z" fill="url(#flame${id})" opacity=".85"/>
    <path class="wisp w2" d="M270 196 C284 184 300 182 312 186 C300 192 292 202 280 212Z" fill="url(#flame${id})" opacity=".7"/>
    <path class="wisp w3" d="M250 150 C246 128 252 108 262 96 C262 116 266 132 262 152Z" fill="${G}" opacity=".7"/>
    <path d="M206 262 C244 258 262 228 262 194" stroke="${sh}" stroke-width="9" fill="none" stroke-linecap="round" opacity=".35"/>
    <path d="M226 252 C250 238 262 214 264 186 C268 168 276 156 286 148" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".45"/>
    <ellipse cx="276" cy="136" rx="16" ry="22" fill="${G}" filter="url(#glow${id})" class="pulse" transform="rotate(30 276 136)"/>
    <path d="M262 152 C270 138 284 130 296 124" stroke="${rim}" stroke-width="3" fill="none" stroke-linecap="round"/>
    ${[[288,128,0],[300,160,.5],[266,110,1],[310,196,1.5],[282,150,2]].map(([x,y,dl])=>`<g class="spark" style="animation-delay:-${dl}s">${star(x,y,5,'#fff')}</g>`).join('')}`;
  const extras=(v.horns?`<g><path d="M126 118 l6 -26 8 24z" fill="url(#crys${id})" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/><path d="M174 118 l-6 -26 -8 24z" fill="url(#crys${id})" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/><path d="M130 112 l3 -14" stroke="#fff" stroke-width="1.6" opacity=".8"/></g>`:'')
   +(v.gem?`<g><path d="M150 124 l9 12 -9 13 -9 -13z" fill="url(#crys${id})" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/><path d="M150 124 l9 12 -9 13 -9 -13z" fill="${G}" opacity=".5" filter="url(#glow${id})" class="pulse"/><path d="M146 132 l3 -4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>`:'')
   +(v.accent==='leaf'?`<g transform="translate(198 122) rotate(28)"><path d="M0 0 C10 -10 24 -8 30 0 C24 8 10 10 0 0Z" fill="#6ad08a" stroke="${ink}" stroke-width="1.8"/><path d="M2 0 H26" stroke="#2f8a5a" stroke-width="1.2"/><path d="M6 6 C14 14 24 14 28 10 C22 4 12 4 6 6Z" fill="#9ae0a0" stroke="${ink}" stroke-width="1.5"/></g>`
    :v.accent==='flower'?`<g transform="translate(200 124)">${[0,72,144,216,288].map(a=>`<ellipse rx="5.5" ry="8.5" cy="-7" fill="#ffd0ea" stroke="${ink}" stroke-width="1.4" transform="rotate(${a})"/>`).join('')}<circle r="4.5" fill="#ffe27a" stroke="${ink}" stroke-width="1.4"/></g>`:'');
  return `<svg viewBox="0 0 320 330" class="rig" data-expr="happy" role="img" aria-label="Spirit-fox Slyte, seed ${v.seed}">
  <defs>
   <linearGradient id="fur${id}" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset=".5" stop-color="${c2}"/><stop offset="1" stop-color="${c3}"/></linearGradient>
   <linearGradient id="leg${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c2}"/><stop offset="1" stop-color="${c3}"/></linearGradient>
   <linearGradient id="flame${id}" x1="0" y1="1" x2=".8" y2="0"><stop offset="0" stop-color="${c3}"/><stop offset=".5" stop-color="${c2}"/><stop offset=".85" stop-color="${c1}"/><stop offset="1" stop-color="${G}"/></linearGradient>
   <linearGradient id="cream${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdff"/><stop offset="1" stop-color="${mix(cr,c2,.25)}"/></linearGradient>
   <linearGradient id="crys${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="${G}"/><stop offset="1" stop-color="${P.e}"/></linearGradient>
   <radialGradient id="iris${id}" cx=".5" cy=".65"><stop offset="0" stop-color="${mix(P.e,'#fff8c0',.6)}"/><stop offset=".6" stop-color="${P.e}"/><stop offset="1" stop-color="${mix(P.e,'#140a24',.5)}"/></radialGradient>
   <radialGradient id="shadow${id}"><stop offset="0" stop-color="#140a24" stop-opacity=".4"/><stop offset="1" stop-color="#140a24" stop-opacity="0"/></radialGradient>
   <radialGradient id="aura${id}"><stop offset="0" stop-color="${G}" stop-opacity=".35"/><stop offset="1" stop-color="${G}" stop-opacity="0"/></radialGradient>
   <pattern id="grain${id}" width="96" height="96" patternUnits="userSpaceOnUse"><image href="${GRAIN}" width="96" height="96"/></pattern>
   <filter id="glow${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
   <clipPath id="bodyclip${id}"><path d="M150 186 C198 186 214 236 206 290 L94 290 C86 236 102 186 150 186Z"/></clipPath>
   <clipPath id="headclip${id}"><path id="headp${id}" d="M150 108 C200 108 226 140 224 172 L236 182 L226 188 L234 198 L218 202 C206 226 180 238 150 238 C120 238 94 226 82 202 L66 198 L74 188 L64 182 L76 172 C74 140 100 108 150 108Z"/></clipPath>
  </defs>
  <ellipse cx="150" cy="210" rx="140" ry="130" fill="url(#aura${id})" class="pulse"/>

function grass(r,n,y0,y1,cols){let o='';for(let i=0;i<n;i++){const x=r()*600,y=y0+r()*(y1-y0),h=10+22*(y-y0)/(y1-y0)+r()*8;o+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} q${(3+r()*5).toFixed(1)} ${(-h*.55).toFixed(1)} ${((r()-.35)*12).toFixed(1)} ${(-h).toFixed(1)}" stroke="${cols[Math.floor(r()*cols.length)]}" stroke-width="${(2+r()*2.5).toFixed(1)}" fill="none" stroke-linecap="round"/>`}return o}
function glowFlowers(r,n,y0,y1,id){let o='';const cs=['#9ff7ff','#ffc8ff','#fff2a0','#b8ffcf','#ffd0ec'];for(let i=0;i<n;i++){const x=r()*600,y=y0+r()*(y1-y0),s=3+6*(y-y0)/(y1-y0),c=cs[Math.floor(r()*cs.length)];
  o+=`<g class="gf" style="animation-delay:-${(r()*3.5).toFixed(2)}s"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(s*3.2).toFixed(1)}" fill="url(#gl${id})" opacity=".8"/><path d="M${x.toFixed(1)} ${(y+s).toFixed(1)} v${(s*2.4).toFixed(1)}" stroke="#2f7a5a" stroke-width="1.6"/>${[0,72,144,216,288].map(a=>`<ellipse cx="${x.toFixed(1)}" cy="${(y-s*.6).toFixed(1)}" rx="${(s*.45).toFixed(1)}" ry="${(s*.7).toFixed(1)}" fill="${c}" transform="rotate(${a} ${x.toFixed(1)} ${y.toFixed(1)})"/>`).join('')}<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(s*.4).toFixed(1)}" fill="#fff"/></g>`}return o}

 ]}
const glowLayer=seed=>{const r=rng(seed*11+7);return `<svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMax slice"><defs><radialGradient id="gl${seed}"><stop offset="0" stop-color="#fffbe0" stop-opacity=".8"/><stop offset="1" stop-color="#fffbe0" stop-opacity="0"/></radialGradient></defs>${glowFlowers(r,26,600,790,seed)}</svg>`};

function build(seeds){const g=$('#grid');g.innerHTML='';cards.length=0;

    const pup=el.querySelector('.puppet');pup.addEventListener('click',()=>{pup.classList.remove('hop');void pup.offsetWidth;pup.classList.add('hop')});

    const sc=el.querySelector('.scene');sc.addEventListener('pointermove',e=>{const b=sc.getBoundingClientRect();parallax(el,(e.clientX-b.left)/b.width-.5,(e.clientY-b.top)/b.height-.5)});
    sc.addEventListener('pointerleave',()=>parallax(el,0,0));});
}
function parallax(card,x,y){card.querySelectorAll('.layer').forEach(l=>{const d=+l.dataset.depth;l.style.transform=`translate(${(-x*d).toFixed(1)}px,${(-y*d*.5).toFixed(1)}px)`})}

function life(){cards.forEach(c=>{const s=c.svg,t=performance.now();
  if(!c.nb||t>c.nb){s.classList.add('blink');setTimeout(()=>s.classList.remove('blink'),130);if(Math.random()<.2)setTimeout(()=>{s.classList.add('blink');setTimeout(()=>s.classList.remove('blink'),120)},260);c.nb=t+2200+Math.random()*3500}
  if(!c.ne||t>c.ne){const k=Math.random()<.5?'flickL':'flickR';s.classList.add(k);setTimeout(()=>s.classList.remove(k),520);c.ne=t+3000+Math.random()*5000}
  if(!c.nt||t>c.nt){s.classList.add('tflick');setTimeout(()=>s.classList.remove('tflick'),720);c.nt=t+4000+Math.random()*6000}})}
